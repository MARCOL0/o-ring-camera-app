<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detector NAA - Cámara Frontal (Móvil)</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --success-color: #32d74b;
            --warning-color: #ffd60a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        #header {
            width: 100%;
            padding: 10px 0;
            text-align: center;
            background-color: var(--panel-bg);
            z-index: 20;
            flex-shrink: 0;
        }

        h1 { margin: 0; font-size: 1.1rem; font-weight: 500; }

        #main-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }

        #video-element { display: none; }

        #main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            touch-action: none;
        }

        #status-overlay {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 1px solid #333;
            min-width: 200px;
        }

        #status-text {
            font-size: 1.4rem;
            font-weight: bold;
            margin: 0;
            letter-spacing: 0.5px;
        }

        #status-text.centrada { color: var(--success-color); }
        #status-text.descentrada { color: var(--danger-color); }
        #status-text.buscando { color: var(--text-color); font-size: 1.1rem; }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.9);
            pointer-events: none;
            z-index: 10;
            text-shadow: 0px 1px 3px rgba(0,0,0,1);
        }

        #controls {
            width: 100%;
            background-color: var(--panel-bg);
            padding: 15px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-sizing: border-box;
            z-index: 20;
            flex-shrink: 0;
        }
        
        .row-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn {
            background-color: #333;
            color: white;
            border: none;
            padding: 14px 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            flex: 1; 
            text-align: center;
        }
        
        /* Botón destacado para realizar la comprobación */
        .btn-check {
            background-color: var(--accent-color);
            font-size: 1.1rem;
            padding: 16px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(10, 132, 255, 0.4);
        }

        .btn:active { transform: scale(0.97); filter: brightness(0.9); }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="header">
        <h1>Alineación NAA (Cámara Frontal)</h1>
    </div>

    <div id="main-container">
        <video id="video-element" autoplay playsinline></video>
        <canvas id="main-canvas"></canvas>
        
        <div id="status-overlay">
            <p id="status-text" class="buscando">MUEVE EL ANILLO Y PULSA COMPROBAR</p>
            <p id="debug-text" style="font-size: 0.85rem; margin-top:5px; color:#aaa;">Listo para escanear</p>
        </div>
        
        <div class="instructions" id="inst-text">👆 Arrastra el círculo. Tira del punto amarillo para tamaño.</div>
    </div>

    <div id="controls">
        <button id="btn-comprobar" class="btn btn-check">🔍 COMPROBAR CENTRADO</button>
        <div class="row-buttons">
            <button id="btn-camera" class="btn">Activar Cámara Frontal</button>
            <button id="btn-image" class="btn" onclick="document.getElementById('file-input').click()">📁 Cargar Foto</button>
        </div>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <script>
        const video = document.getElementById('video-element');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const debugText = document.getElementById('debug-text');
        const instText = document.getElementById('inst-text');
        
        const btnCamera = document.getElementById('btn-camera');
        const btnComprobar = document.getElementById('btn-comprobar');
        const fileInput = document.getElementById('file-input');

        let isVideoPlaying = false;
        let staticImage = null;
        let reqAnimFrame;

        // Variables del O-ring
        let measureX = 0;
        let measureY = 0;
        let measureRadius = 50;

        let isDragging = false;
        let isResizing = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        
        // Estado del test
        let comprobacionActiva = false;
        // Resultados guardados en el momento de pulsar el botón
        let ultimosPuntosRojos = [];
        let ultimosPuntosVerdes = [];

        function resizeCanvas() {
            const container = document.getElementById('main-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            if (measureX === 0) {
                measureX = canvas.width / 2;
                measureY = canvas.height / 2;
                measureRadius = Math.min(canvas.width, canvas.height) / 4;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            // Si está bloqueado mostrando el resultado, un toque desbloquea y reinicia
            if (comprobacionActiva) {
                comprobacionActiva = false;
                statusText.textContent = "MUEVE EL ANILLO Y PULSA COMPROBAR";
                statusText.className = "buscando";
                debugText.textContent = "Listo para escanear";
                instText.style.display = "block";
                return;
            }

            const pos = getPointerPos(e);
            const dx = pos.x - measureX;
            const dy = pos.y - measureY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (Math.abs(dist - measureRadius) < 40) {
                isResizing = true;
            } else if (dist < measureRadius) {
                isDragging = true;
                dragOffsetX = measureX - pos.x;
                dragOffsetY = measureY - pos.y;
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging && !isResizing || comprobacionActiva) return;
            e.preventDefault(); 
            
            const pos = getPointerPos(e);
            
            if (isDragging) {
                measureX = pos.x + dragOffsetX;
                measureY = pos.y + dragOffsetY;
            } else if (isResizing) {
                const dx = pos.x - measureX;
                const dy = pos.y - measureY;
                measureRadius = Math.max(40, Math.sqrt(dx*dx + dy*dy));
            }
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
            isResizing = false;
        });

        btnCamera.addEventListener('click', async () => {
            staticImage = null;
            comprobacionActiva = false;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                video.play();
                isVideoPlaying = true;
                if (!reqAnimFrame) processFrame();
            } catch (err) {
                alert("Error al abrir cámara frontal. Revisa los permisos.");
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            isVideoPlaying = false;
            comprobacionActiva = false;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    staticImage = img;
                    if (!reqAnimFrame) processFrame();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // LÓGICA DEL BOTÓN COMPROBAR
        btnComprobar.addEventListener('click', () => {
            if (!isVideoPlaying && !staticImage) {
                alert("Primero debes activar la cámara o subir una foto.");
                return;
            }
            // Esto activará el análisis profundo en el próximo frame
            comprobacionActiva = true;
            instText.style.display = "none";
        });

        function processFrame() {
            // 1. Dibujar el fotograma
            if (isVideoPlaying && video.readyState === video.HAVE_ENOUGH_DATA) {
                const hRatio = canvas.width / video.videoWidth;
                const vRatio = canvas.height / video.videoHeight;
                const ratio = Math.max(hRatio, vRatio);
                const centerShift_x = (canvas.width - video.videoWidth * ratio) / 2;
                const centerShift_y = (canvas.height - video.videoHeight * ratio) / 2;
                
                ctx.save();
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, -centerShift_x, centerShift_y, video.videoWidth * ratio, video.videoHeight * ratio);
                ctx.restore();

            } else if (staticImage) {
                const hRatio = canvas.width / staticImage.width;
                const vRatio = canvas.height / staticImage.height;
                const ratio = Math.min(hRatio, vRatio);
                const centerShift_x = (canvas.width - staticImage.width * ratio) / 2;
                const centerShift_y = (canvas.height - staticImage.height * ratio) / 2;  
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                ctx.drawImage(staticImage, 0, 0, staticImage.width, staticImage.height, centerShift_x, centerShift_y, staticImage.width * ratio, staticImage.height * ratio);
            } else {
                ctx.fillStyle = '#111';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                reqAnimFrame = requestAnimationFrame(processFrame);
                return;
            }

            // 2. Si el usuario ha pulsado COMPROBAR, ejecutamos el algoritmo
            if (comprobacionActiva) {
                const startX = Math.max(0, measureX - measureRadius);
                const startY = Math.max(0, measureY - measureRadius);
                const endX = Math.min(canvas.width, measureX + measureRadius);
                const endY = Math.min(canvas.height, measureY + measureRadius);
                const width = endX - startX;
                const height = endY - startY;

                if (width > 0 && height > 0) {
                    const imgData = ctx.getImageData(startX, startY, width, height);
                    const data = imgData.data;
                    
                    ultimosPuntosRojos = [];
                    ultimosPuntosVerdes = [];
                    let totalPixelesNucleo = 0;
                    const radioNucleo = measureRadius * 0.70; 
                    
                    const grises = new Uint8Array(width * height);
                    for (let i = 0; i < data.length; i += 4) {
                        grises[i/4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                    }

                    // Aumento de tolerancia: el salto de luz (laplaciano) ahora solo necesita ser > 35 (antes 60)
                    for (let y = 1; y < height - 1; y += 2) {
                        for (let x = 1; x < width - 1; x += 2) {
                            const canvasX = startX + x;
                            const canvasY = startY + y;
                            const dx = canvasX - measureX;
                            const dy = canvasY - measureY;
                            const dist = Math.sqrt(dx*dx + dy*dy);

                            if (dist <= measureRadius) {
                                const idx = y * width + x;
                                const centerPx = grises[idx];
                                const laplacian = Math.abs(
                                    4 * centerPx 
                                    - grises[idx - 1] 
                                    - grises[idx + 1] 
                                    - grises[(y-1) * width + x] 
                                    - grises[(y+1) * width + x]
                                );

                                // Filtro bajado a 35 para ser más sensible en móviles oscuros
                                if (laplacian > 35 && centerPx > 70) { 
                                    if (dist < radioNucleo) {
                                        ultimosPuntosRojos.push({x: canvasX, y: canvasY});
                                    } else {
                                        ultimosPuntosVerdes.push({x: canvasX, y: canvasY});
                                    }
                                }
                                if (dist < radioNucleo) totalPixelesNucleo++;
                            }
                        }
                    }

                    const puntosCortantes = ultimosPuntosRojos.length;
                    const puntosBorde = ultimosPuntosVerdes.length;
                    const densidadCorte = totalPixelesNucleo > 0 ? (puntosCortantes / totalPixelesNucleo) * 100 : 0;
                    
                    debugText.textContent = `Pixeles centro: ${puntosCortantes} (${densidadCorte.toFixed(2)}%) | Borde: ${puntosBorde}`;

                    // Lógica estricta de decisión
                    // Umbral de corte bajado a 0.25% para detectar rápido cualquier fallo
                    if (densidadCorte > 0.25) { 
                        statusText.textContent = "❌ DESCENTRADA";
                        statusText.className = "descentrada";
                    } else if (puntosBorde > 8) { // Solo necesita detectar 8 puntos en el borde para dar el OK
                        statusText.textContent = "✅ CENTRADA";
                        statusText.className = "centrada";
                    } else {
                        statusText.textContent = "⚠️ MUESTRA NO DETECTADA";
                        statusText.className = "buscando";
                        debugText.textContent = "El interior está vacío o muy oscuro";
                    }
                }
            }

            // 3. DIBUJAR LOS PUNTOS ENCONTRADOS SI ESTAMOS EN MODO RESULTADO
            if (comprobacionActiva) {
                ctx.fillStyle = 'rgba(255, 69, 58, 0.8)'; // Rojo intenso
                for(let p of ultimosPuntosRojos) {
                    ctx.fillRect(p.x, p.y, 4, 4);
                }
                ctx.fillStyle = 'rgba(50, 215, 75, 0.6)'; // Verde brillante
                for(let p of ultimosPuntosVerdes) {
                    ctx.fillRect(p.x, p.y, 3, 3);
                }
            }

            // 4. DIBUJAR GUÍAS (O-Ring)
            ctx.beginPath();
            ctx.arc(measureX, measureY, measureRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = comprobacionActiva ? 'rgba(255, 255, 255, 0.3)' : 'rgba(255, 235, 59, 0.9)';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(measureX, measureY, measureRadius * 0.70, 0, 2 * Math.PI);
            ctx.strokeStyle = comprobacionActiva ? 'rgba(255, 255, 255, 0.1)' : 'rgba(255, 255, 255, 0.4)';
            ctx.setLineDash([6, 6]);
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.setLineDash([]); 

            // Tirador para redimensionar (Solo se dibuja si NO está en modo comprobación)
            if (!comprobacionActiva) {
                ctx.beginPath();
                ctx.arc(measureX + measureRadius, measureY, 15, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255, 235, 59, 0.8)';
                ctx.fill();
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            reqAnimFrame = requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
