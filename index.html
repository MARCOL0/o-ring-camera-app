<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Viewport adaptativo para móviles: deshabilita zoom y se ajusta a la pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detector NAA - Cámara Frontal (Móvil)</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #007bff;
            --danger-color: #ff3b30;
            --success-color: #34c759;
            --warning-color: #ffcc00;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; /* Evita cualquier scroll en la pantalla del móvil */
            display: flex;
            flex-direction: column;
        }

        /* 1. Header Fijo superior */
        #header {
            width: 100%;
            padding: 10px 0;
            text-align: center;
            background-color: var(--panel-bg);
            z-index: 20;
            flex-shrink: 0;
        }

        h1 { margin: 0; font-size: 1.1rem; font-weight: 500; }

        /* 2. Contenedor principal de la cámara (Ocupa todo el espacio restante) */
        #main-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }

        #video-element { display: none; }

        /* El Canvas ocupará el 100% del contenedor padre */
        #main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Adapta el video llenando toda la pantalla sin distorsión */
            touch-action: none;
        }

        /* 3. Textos flotantes sobre la cámara */
        #status-overlay {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.75);
            padding: 12px 24px;
            border-radius: 12px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        #status-text {
            font-size: 1.6rem;
            font-weight: bold;
            margin: 0;
            letter-spacing: 1px;
        }

        #status-text.centrada { color: var(--success-color); }
        #status-text.descentrada { color: var(--danger-color); }
        #status-text.buscando { color: var(--warning-color); }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.85);
            pointer-events: none;
            z-index: 10;
            text-shadow: 0px 1px 3px rgba(0,0,0,0.8);
        }

        /* 4. Panel inferior de botones */
        #controls {
            width: 100%;
            background-color: var(--panel-bg);
            padding: 12px;
            display: flex;
            justify-content: space-around;
            gap: 10px;
            box-sizing: border-box;
            z-index: 20;
            flex-shrink: 0;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            flex: 1; /* Ocupan mitades iguales de la pantalla */
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:active { background-color: #0056b3; transform: scale(0.97); }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="header">
        <h1>Alineación NAA (Cámara Frontal)</h1>
    </div>

    <div id="main-container">
        <video id="video-element" autoplay playsinline></video>
        <!-- Canvas donde se dibuja el video y el procesamiento -->
        <canvas id="main-canvas"></canvas>
        
        <div id="status-overlay">
            <p id="status-text" class="buscando">INICIANDO...</p>
            <p id="debug-text" style="font-size: 0.85rem; margin-top:5px; color:#ccc;">Métricas: --</p>
        </div>
        
        <div class="instructions">👆 Arrastra el círculo al agujero. Tira del punto amarillo para ajustar el tamaño.</div>
    </div>

    <div id="controls">
        <button id="btn-camera" class="btn">Activar Cámara Frontal</button>
        <button id="btn-image" class="btn" style="background-color: #555;" onclick="document.getElementById('file-input').click()">📁 Cargar Foto</button>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <script>
        const video = document.getElementById('video-element');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const debugText = document.getElementById('debug-text');
        const btnCamera = document.getElementById('btn-camera');
        const fileInput = document.getElementById('file-input');

        let isVideoPlaying = false;
        let staticImage = null;
        let reqAnimFrame;

        // Variables del O-ring
        let measureX = 0;
        let measureY = 0;
        let measureRadius = 50;

        let isDragging = false;
        let isResizing = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // Función para ajustar el tamaño del canvas interno al tamaño real del contenedor
        function resizeCanvas() {
            const container = document.getElementById('main-container');
            // Damos al canvas la resolución real de la pantalla del dispositivo
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // Centrar el anillo la primera vez que se carga
            if (measureX === 0) {
                measureX = canvas.width / 2;
                measureY = canvas.height / 2;
                measureRadius = Math.min(canvas.width, canvas.height) / 4;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        // Pequeño retardo al iniciar para asegurar que el DOM ha calculado el tamaño
        setTimeout(resizeCanvas, 100);

        // Control táctil
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            const pos = getPointerPos(e);
            
            const dx = pos.x - measureX;
            const dy = pos.y - measureY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            const edgeTolerance = 35; // Amplio margen táctil para el móvil

            if (Math.abs(dist - measureRadius) < edgeTolerance) {
                isResizing = true;
            } else if (dist < measureRadius) {
                isDragging = true;
                dragOffsetX = measureX - pos.x;
                dragOffsetY = measureY - pos.y;
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging && !isResizing) return;
            e.preventDefault(); 
            
            const pos = getPointerPos(e);
            
            if (isDragging) {
                measureX = pos.x + dragOffsetX;
                measureY = pos.y + dragOffsetY;
            } else if (isResizing) {
                const dx = pos.x - measureX;
                const dy = pos.y - measureY;
                measureRadius = Math.max(40, Math.sqrt(dx*dx + dy*dy));
            }
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
            isResizing = false;
        });

        // 1. SOLUCIÓN CÁMARA FRONTAL
        btnCamera.addEventListener('click', async () => {
            staticImage = null;
            try {
                // facingMode: "user" fuerza el uso de la cámara frontal de selfies en móviles
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                video.play();
                isVideoPlaying = true;
                if (!reqAnimFrame) processFrame();
            } catch (err) {
                console.error("Error cámara:", err);
                alert("Error al abrir cámara frontal. Permite el acceso en tu navegador.");
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            isVideoPlaying = false;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    staticImage = img;
                    if (!reqAnimFrame) processFrame();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // 2. PROCESAMIENTO Y VISIÓN COMPUTACIONAL
        function processFrame() {
            // Dibujar cámara o imagen ajustando los recortes (object-fit: cover casero)
            if (isVideoPlaying && video.readyState === video.HAVE_ENOUGH_DATA) {
                const hRatio = canvas.width / video.videoWidth;
                const vRatio = canvas.height / video.videoHeight;
                const ratio = Math.max(hRatio, vRatio); // Max = Cover
                const centerShift_x = (canvas.width - video.videoWidth * ratio) / 2;
                const centerShift_y = (canvas.height - video.videoHeight * ratio) / 2;
                
                // Efecto espejo (flip horizontal) muy útil al usar cámara frontal para manipular muestras
                ctx.save();
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, -centerShift_x, centerShift_y, video.videoWidth * ratio, video.videoHeight * ratio);
                ctx.restore();

            } else if (staticImage) {
                const hRatio = canvas.width / staticImage.width;
                const vRatio = canvas.height / staticImage.height;
                const ratio = Math.min(hRatio, vRatio); // Min = Fit para fotos enteras
                const centerShift_x = (canvas.width - staticImage.width * ratio) / 2;
                const centerShift_y = (canvas.height - staticImage.height * ratio) / 2;  
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                ctx.drawImage(staticImage, 0, 0, staticImage.width, staticImage.height, centerShift_x, centerShift_y, staticImage.width * ratio, staticImage.height * ratio);
            } else {
                ctx.fillStyle = '#111';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                reqAnimFrame = requestAnimationFrame(processFrame);
                return;
            }

            // LÍMITES DE ESCANEO
            const startX = Math.max(0, measureX - measureRadius);
            const startY = Math.max(0, measureY - measureRadius);
            const endX = Math.min(canvas.width, measureX + measureRadius);
            const endY = Math.min(canvas.height, measureY + measureRadius);
            const width = endX - startX;
            const height = endY - startY;

            if (width > 0 && height > 0) {
                const imgData = ctx.getImageData(startX, startY, width, height);
                const data = imgData.data;
                
                let puntosCortantes = 0; 
                let puntosBorde = 0;     
                let totalPixelesNucleo = 0;
                const radioNucleo = measureRadius * 0.70; 
                
                // Conversión Escala Grises
                const grises = new Uint8Array(width * height);
                for (let i = 0; i < data.length; i += 4) {
                    grises[i/4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                }

                // Escaneo de vecinos
                for (let y = 1; y < height - 1; y += 2) {
                    for (let x = 1; x < width - 1; x += 2) {
                        const canvasX = startX + x;
                        const canvasY = startY + y;
                        const dx = canvasX - measureX;
                        const dy = canvasY - measureY;
                        const dist = Math.sqrt(dx*dx + dy*dy);

                        if (dist <= measureRadius) {
                            const idx = y * width + x;
                            const centerPx = grises[idx];
                            // Operador Laplaciano para localizar el salto del óxido
                            const laplacian = Math.abs(
                                4 * centerPx 
                                - grises[idx - 1] 
                                - grises[idx + 1] 
                                - grises[(y-1) * width + x] 
                                - grises[(y+1) * width + x]
                            );

                            if (laplacian > 60 && centerPx > 100) { 
                                if (dist < radioNucleo) {
                                    puntosCortantes++;
                                    ctx.fillStyle = 'rgba(255,0,0,0.6)';
                                    ctx.fillRect(canvasX, canvasY, 2, 2);
                                } else {
                                    puntosBorde++;
                                    ctx.fillStyle = 'rgba(0,255,0,0.4)';
                                    ctx.fillRect(canvasX, canvasY, 2, 2);
                                }
                            }
                            
                            if (dist < radioNucleo) totalPixelesNucleo++;
                        }
                    }
                }

                const densidadCorte = totalPixelesNucleo > 0 ? (puntosCortantes / totalPixelesNucleo) * 100 : 0;
                
                debugText.textContent = `Corte centro: ${densidadCorte.toFixed(2)}% | Perímetro: ${puntosBorde}px`;

                // CRITERIO FINAL
                if (densidadCorte > 0.4) { 
                    statusText.textContent = "DESCENTRADA";
                    statusText.className = "descentrada";
                } else if (puntosBorde > 20) {
                    statusText.textContent = "CENTRADA";
                    statusText.className = "centrada";
                } else {
                    statusText.textContent = "BUSCANDO...";
                    statusText.className = "buscando";
                }
            }

            // DIBUJO DE GUÍAS (O-Ring)
            ctx.beginPath();
            ctx.arc(measureX, measureY, measureRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 235, 59, 0.9)'; // Amarillo
            ctx.lineWidth = 2.5;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(measureX, measureY, measureRadius * 0.70, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.setLineDash([6, 6]);
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.setLineDash([]); 

            // Tirador para redimensionar (Punto amarillo sólido)
            ctx.beginPath();
            ctx.arc(measureX + measureRadius, measureY, 15, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 235, 59, 0.8)';
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            reqAnimFrame = requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
