<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alineador NAA - Control de Centrado</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #18181b;
            --text-color: #ffffff;
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --success-color: #32d74b;
            --warning-color: #ffd60a;
            --cyan-color: #00f5d4;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #header {
            width: 100%;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            z-index: 20;
            flex-shrink: 0;
            border-bottom: 1px solid #27272a;
        }

        h1 { margin: 0; font-size: 0.95rem; font-weight: 600; }

        #main-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            background-color: #000;
            overflow: hidden;
        }

        #video-element { display: none; }

        #main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #status-overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(15, 15, 20, 0.92);
            padding: 12px 16px;
            border-radius: 12px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.18);
            width: 92%;
            max-width: 395px;
        }

        #status-text {
            font-size: 1.35rem;
            font-weight: 800;
            margin: 0;
        }

        #status-text.centrada { color: var(--success-color); }
        #status-text.descentrada { color: var(--danger-color); }
        #status-text.buscando { color: var(--warning-color); font-size: 1.05rem; }

        #pct-pvc-text {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 6px 0 2px 0;
            color: var(--cyan-color);
        }

        .instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            text-align: center;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.95);
            background: rgba(0,0,0,0.75);
            padding: 7px 12px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
        }

        #controls {
            width: 100%;
            background-color: var(--panel-bg);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            flex-shrink: 0;
            border-top: 1px solid #27272a;
        }

        .row-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: #27272a;
            color: white;
            border: 1px solid #3f3f46;
            padding: 10px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .btn.active-mode {
            background-color: #1d4ed8;
            border-color: #3b82f6;
        }

        .btn-check {
            background-color: var(--accent-color);
            border: none;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 10px rgba(10, 132, 255, 0.35);
        }

        .btn:active { transform: scale(0.98); filter: brightness(0.9); }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="header">
        <h1>🔬 Alineador NAA</h1>
        <span style="font-size: 0.75rem; color: #00f5d4;">● Borde alumina &nbsp; <span style="color:#ff453a;">● Aluminio</span></span>
    </div>

    <div id="main-container">
        <video id="video-element" autoplay playsinline muted></video>
        <canvas id="main-canvas"></canvas>

        <div id="status-overlay">
            <p id="status-text" class="buscando">TOCA EL AGUJERO Y PULSA COMPROBAR</p>
            <p id="pct-pvc-text">Borde alumina: --%</p>
            <p id="debug-text" style="font-size: 0.75rem; margin: 2px 0 0 0; color:#cbd5e1;">
                Detección de aluminio sin anodizar
            </p>
        </div>

        <div id="inst-text" class="instructions">
            👆 Toca el hueco negro para encajar el círculo o arrástralo
        </div>
    </div>

    <div id="controls">
        <button id="btn-comprobar" class="btn btn-check">COMPROBAR</button>
        <div class="row-buttons">
            <button id="btn-autosnap" class="btn active-mode">🧲 Auto-PVC: ON</button>
            <button id="btn-camera" class="btn">📷 Cámara</button>
            <button id="btn-image" class="btn">📁 Foto</button>
        </div>
        <input type="file" id="file-input" accept="image/*">
    </div>

        const statusText = document.getElementById('status-text');
        const pctPvcText = document.getElementById('pct-pvc-text');
        const debugText = document.getElementById('debug-text');
        const btnAutoSnap = document.getElementById('btn-autosnap');
        const btnImage = document.getElementById('btn-image');
        const fileInput = document.getElementById('file-input');

        const roiCanvas = document.createElement('canvas');
        roiCanvas.width = IMGSZ;
        roiCanvas.height = IMGSZ;
        const roiCtx = roiCanvas.getContext('2d', { willReadFrequently: true });

        let isVideoPlaying = false;
        let staticImage = null;
        let reqAnimFrame = null;

        let measureX = 0;
