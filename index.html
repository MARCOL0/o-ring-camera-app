<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Detector NAA - Cámara Trasera y Móvil</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #007bff;
            --danger-color: #dc3545;
            --success-color: #28a745;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Altura dinámica para evitar que la barra de navegación del móvil oculte botones */
            min-height: 100vh; 
            overflow: hidden;
        }

        #header {
            width: 100%;
            padding: 15px 0;
            text-align: center;
            background-color: var(--panel-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.2rem; font-weight: normal; }

        #main-container {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #video-element { display: none; }

        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            /* Usamos la altura completa disponible para maximizar el visor en móviles */
            height: 100%; 
            background-color: #000;
        }

        #main-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #status-overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            pointer-events: none;
            width: 80%;
            max-width: 300px; /* Evita que sea excesivamente ancho */
        }

        #status-text {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 0;
        }

        #status-text.centrada { color: var(--success-color); }
        #status-text.descentrada { color: var(--danger-color); }
        #status-text.buscando { color: #ffc107; }

        /* Controles adaptables (Responsive) */
        #controls {
            width: 100%;
            background-color: var(--panel-bg);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            box-sizing: border-box;
            z-index: 10;
            flex-wrap: wrap; /* Permite que los botones pasen a la siguiente línea si no caben */
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            flex: 1; /* Los botones crecen para ocupar el espacio */
            min-width: 150px; /* Anchura mínima antes de saltar de línea */
            max-width: 300px;
            text-align: center;
        }

        .btn:hover { background-color: #0056b3; }
        .btn:active { transform: scale(0.98); }

        #file-input { display: none; }
        
        .instructions {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
            pointer-events: none;
            padding: 0 10px;
            box-sizing: border-box;
        }

        /* Media Query para pantallas muy estrechas (móviles en vertical) */
        @media (max-width: 400px) {
            #controls {
                flex-direction: column; /* Apila los botones uno encima de otro */
                padding: 10px;
                gap: 10px;
            }
            .btn {
                max-width: 100%; /* El botón ocupa todo el ancho */
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>NAA Align (Cámara Trasera)</h1>
    </div>

    <div id="main-container">
        <div id="canvas-container">
            <video id="video-element" autoplay playsinline></video>
            <canvas id="main-canvas"></canvas>
            
            <div id="status-overlay">
                <p id="status-text" class="buscando">INICIANDO...</p>
                <p id="debug-text" style="font-size: 0.8rem; margin-top:5px; color:#ccc;">Calculando cortes</p>
            </div>
            
            <div class="instructions">Arrastra el círculo amarillo al agujero. Tira del borde para el tamaño.</div>
        </div>
    </div>

    <div id="controls">
        <button id="btn-camera" class="btn">Activar Cámara</button>
        <button id="btn-image" class="btn" onclick="document.getElementById('file-input').click()">Cargar Imagen</button>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <script>
        const video = document.getElementById('video-element');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const debugText = document.getElementById('debug-text');
        const btnCamera = document.getElementById('btn-camera');
        const fileInput = document.getElementById('file-input');

        let isVideoPlaying = false;
        let staticImage = null;
        let reqAnimFrame;

        let measureX = 0;
        let measureY = 0;
        let measureRadius = 50;

        let isDragging = false;
        let isResizing = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            if (measureX === 0) {
                measureX = canvas.width / 2;
                measureY = canvas.height / 2;
                measureRadius = Math.min(canvas.width, canvas.height) / 4;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            const pos = getPointerPos(e);
            
            const dx = pos.x - measureX;
            const dy = pos.y - measureY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            const edgeTolerance = 30; // Aumentado un poco para facilitar el toque en móvil

            if (Math.abs(dist - measureRadius) < edgeTolerance) {
                isResizing = true;
            } else if (dist < measureRadius) {
                isDragging = true;
                dragOffsetX = measureX - pos.x;
                dragOffsetY = measureY - pos.y;
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging && !isResizing) return;
            e.preventDefault(); 
            
            const pos = getPointerPos(e);
            
            if (isDragging) {
                measureX = pos.x + dragOffsetX;
                measureY = pos.y + dragOffsetY;
            } else if (isResizing) {
                const dx = pos.x - measureX;
                const dy = pos.y - measureY;
                measureRadius = Math.max(30, Math.sqrt(dx*dx + dy*dy));
            }
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
            isResizing = false;
        });

        // ACTIVA LA CÁMARA TRASERA
        btnCamera.addEventListener('click', async () => {
            staticImage = null;
            try {
                // Se solicita específicamente "environment" (cámara trasera)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                video.play();
                isVideoPlaying = true;
                if (!reqAnimFrame) processFrame();
            } catch (err) {
                console.error("Error cámara:", err);
                alert("No se pudo acceder a la cámara trasera. Asegúrate de dar permisos.");
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            isVideoPlaying = false;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    staticImage = img;
                    if (!reqAnimFrame) processFrame();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        function processFrame() {
            if (isVideoPlaying && video.readyState === video.HAVE_ENOUGH_DATA) {
                const hRatio = canvas.width / video.videoWidth;
                const vRatio = canvas.height / video.videoHeight;
                const ratio = Math.max(hRatio, vRatio);
                const centerShift_x = (canvas.width - video.videoWidth * ratio) / 2;
                const centerShift_y = (canvas.height - video.videoHeight * ratio) / 2;  
                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, centerShift_x, centerShift_y, video.videoWidth * ratio, video.videoHeight * ratio);
            } else if (staticImage) {
                const hRatio = canvas.width / staticImage.width;
                const vRatio = canvas.height / staticImage.height;
                const ratio = Math.min(hRatio, vRatio);
                const centerShift_x = (canvas.width - staticImage.width * ratio) / 2;
                const centerShift_y = (canvas.height - staticImage.height * ratio) / 2;  
                ctx.fillStyle = '#000';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                ctx.drawImage(staticImage, 0, 0, staticImage.width, staticImage.height, centerShift_x, centerShift_y, staticImage.width * ratio, staticImage.height * ratio);
            } else {
                ctx.fillStyle = '#1e1e1e';
                ctx.fillRect(0,0, canvas.width, canvas.height);
                reqAnimFrame = requestAnimationFrame(processFrame);
                return;
            }

            const startX = Math.max(0, measureX - measureRadius);
            const startY = Math.max(0, measureY - measureRadius);
            const endX = Math.min(canvas.width, measureX + measureRadius);
            const endY = Math.min(canvas.height, measureY + measureRadius);
            const width = endX - startX;
            const height = endY - startY;

            if (width > 0 && height > 0) {
                const imgData = ctx.getImageData(startX, startY, width, height);
                const data = imgData.data;
                
                let puntosCortantes = 0; 
                let puntosBorde = 0;     
                let totalPixelesNucleo = 0;

                const radioNucleo = measureRadius * 0.70; 
                
                const grises = new Uint8Array(width * height);
                for (let i = 0; i < data.length; i += 4) {
                    grises[i/4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                }

                for (let y = 1; y < height - 1; y += 2) {
                    for (let x = 1; x < width - 1; x += 2) {
                        const canvasX = startX + x;
                        const canvasY = startY + y;
                        const dx = canvasX - measureX;
                        const dy = canvasY - measureY;
                        const dist = Math.sqrt(dx*dx + dy*dy);

                        if (dist <= measureRadius) {
                            const idx = y * width + x;
                            const centerPx = grises[idx];
                            const laplacian = Math.abs(
                                4 * centerPx 
                                - grises[idx - 1] 
                                - grises[idx + 1] 
                                - grises[(y-1) * width + x] 
                                - grises[(y+1) * width + x]
                            );

                            if (laplacian > 60 && centerPx > 100) { 
                                if (dist < radioNucleo) {
                                    puntosCortantes++;
                                    ctx.fillStyle = 'rgba(255,0,0,0.5)';
                                    ctx.fillRect(canvasX, canvasY, 2, 2);
                                } else {
                                    puntosBorde++;
                                    ctx.fillStyle = 'rgba(0,255,0,0.3)';
                                    ctx.fillRect(canvasX, canvasY, 2, 2);
                                }
                            }
                            
                            if (dist < radioNucleo) totalPixelesNucleo++;
                        }
                    }
                }

                const densidadCorte = totalPixelesNucleo > 0 ? (puntosCortantes / totalPixelesNucleo) * 100 : 0;
                
                debugText.textContent = `Pixeles cortando centro: ${puntosCortantes} (${densidadCorte.toFixed(2)}%)`;

                if (densidadCorte > 0.4) { 
                    statusText.textContent = "DESCENTRADA";
                    statusText.className = "descentrada";
                } else if (puntosBorde > 20) {
                    statusText.textContent = "CENTRADA";
                    statusText.className = "centrada";
                } else {
                    statusText.textContent = "BUSCANDO...";
                    statusText.className = "buscando";
                }
            }

            ctx.beginPath();
            ctx.arc(measureX, measureY, measureRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = 'yellow';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(measureX, measureY, measureRadius * 0.70, 0, 2 * Math.PI);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.setLineDash([5, 5]);
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.setLineDash([]); 

            ctx.beginPath();
            ctx.arc(measureX + measureRadius, measureY, 12, 0, 2 * Math.PI); // Tirador un poco más grande
            ctx.fillStyle = 'rgba(255,255,0,0.8)';
            ctx.fill();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1;
            ctx.stroke();

            reqAnimFrame = requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
