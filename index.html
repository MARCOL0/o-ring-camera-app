<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alineador NAA - Detección por PVC Negro</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #18181b;
            --text-color: #ffffff;
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --success-color: #32d74b;
            --warning-color: #ffd60a;
            --cyan-color: #00f5d4;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #header {
            width: 100%;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            z-index: 20;
            flex-shrink: 0;
            border-bottom: 1px solid #27272a;
        }

        h1 { margin: 0; font-size: 0.95rem; font-weight: 600; }

        #main-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            background-color: #000;
            overflow: hidden;
        }

        #video-element { display: none; }

        #main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #status-overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(15, 15, 20, 0.90);
            padding: 10px 16px;
            border-radius: 12px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.15);
            width: 92%;
            max-width: 380px;
        }

        #status-text {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
        }

        #status-text.centrada { color: var(--success-color); }
        #status-text.descentrada { color: var(--danger-color); }
        #status-text.buscando { color: var(--warning-color); font-size: 1rem; }

        .instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            text-align: center;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.95);
            background: rgba(0,0,0,0.75);
            padding: 7px 12px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
        }

        #controls {
            width: 100%;
            background-color: var(--panel-bg);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            flex-shrink: 0;
            border-top: 1px solid #27272a;
        }

        .param-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: #d4d4d8;
        }

        .param-bar input[type="range"] {
            flex: 1;
            accent-color: var(--accent-color);
        }

        .row-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: #27272a;
            color: white;
            border: 1px solid #3f3f46;
            padding: 10px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .btn.active-mode {
            background-color: #1d4ed8;
            border-color: #3b82f6;
        }

        .btn-check {
            background-color: var(--accent-color);
            border: none;
            font-size: 0.96rem;
            font-weight: 700;
            padding: 13px;
            box-shadow: 0 3px 10px rgba(10, 132, 255, 0.35);
        }

        .btn:active { transform: scale(0.98); filter: brightness(0.9); }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="header">
        <h1>🔬 Alineador NAA (Referencia PVC Negro)</h1>
        <span style="font-size: 0.72rem; color: #00f5d4;">● Puntos Blancos</span>
    </div>

    <div id="main-container">
        <video id="video-element" autoplay playsinline muted></video>
        <canvas id="main-canvas"></canvas>

        <div id="status-overlay">
            <p id="status-text" class="buscando">TOCA EL HUECO DE LA CELDA</p>
            <p id="debug-text" style="font-size: 0.78rem; margin: 4px 0 0 0; color:#cbd5e1;">
                El círculo se ajustará solo al plástico negro de PVC
            </p>
        </div>

        <div class="instructions" id="inst-text">
            👆 Toca dentro del agujero: el anillo se encaja solo en el PVC negro
        </div>
    </div>

    <div id="controls">
        <div class="param-bar">
            <span>Tolerancia admitida:</span>
            <input type="range" id="slider-tol" min="10" max="40" value="25">
            <span id="val-tol">25%</span>
        </div>
        <button id="btn-comprobar" class="btn btn-check">🎯 AUTO-AJUSTAR AL PVC Y COMPROBAR</button>
        <div class="row-buttons">
            <button id="btn-autosnap" class="btn active-mode">🧲 Auto-PVC: ON</button>
            <button id="btn-camera" class="btn">📷 Cámara</button>
            <button id="btn-image" class="btn" onclick="document.getElementById('file-input').click()">📁 Foto</button>
        </div>
        <input type="file" id="file-input" accept="image/*">
    </div>

    <script>
        const video = document.getElementById('video-element');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const debugText = document.getElementById('debug-text');
        const sliderTol = document.getElementById('slider-tol');
        const valTol = document.getElementById('val-tol');
        const btnAutoSnap = document.getElementById('btn-autosnap');

        // Matriz normalizada para procesar el hueco
        const IMGSZ = 160;
        const roiCanvas = document.createElement('canvas');
        roiCanvas.width = IMGSZ;
        roiCanvas.height = IMGSZ;
        const roiCtx = roiCanvas.getContext('2d', { willReadFrequently: true });

        let isVideoPlaying = false;
        let staticImage = null;
        let reqAnimFrame = null;

        // Coordenadas del hueco de PVC detectado
        let measureX = 0;
        let measureY = 0;
        let measureRadius = 70;

        let autoSnapPVC = true;
        let toleranciaMax = 25; // % de desvío máximo permitido respecto al borde de PVC

        let isDragging = false;
        let isResizing = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // Resultados del análisis
        let comprobacionActiva = false;
        let puntosBlancosBorde = [];
        let puntosBlancosInternos = [];
        let centroMembrana = null;

        sliderTol.addEventListener('input', (e) => {
            toleranciaMax = parseInt(e.target.value, 10);
            valTol.textContent = toleranciaMax + '%';
            if (comprobacionActiva) analizarSinAutoSnap();
        });

        btnAutoSnap.addEventListener('click', () => {
            autoSnapPVC = !autoSnapPVC;
            btnAutoSnap.textContent = `🧲 Auto-PVC: ${autoSnapPVC ? 'ON' : 'OFF'}`;
            btnAutoSnap.classList.toggle('active-mode', autoSnapPVC);
        });

        function resizeCanvas() {
            const container = document.getElementById('main-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            if (measureX === 0 && canvas.width > 0) {
                measureX = canvas.width / 2;
                measureY = canvas.height / 2;
                measureRadius = Math.min(canvas.width, canvas.height) * 0.20;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 80);

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            const pos = getPointerPos(e);
            const dist = Math.hypot(pos.x - measureX, pos.y - measureY);

            comprobacionActiva = false;

            // Si toca el punto amarillo lateral, permite ajustar el radio manualmente
            if (Math.abs(dist - measureRadius) < 32 && Math.abs(pos.x - (measureX + measureRadius)) < 40) {
                isResizing = true;
                return;
            }

            // Si toca en cualquier parte, coloca ahí la semilla y arrastra
            if (dist < measureRadius * 1.1) {
                isDragging = true;
                dragOffsetX = measureX - pos.x;
                dragOffsetY = measureY - pos.y;
            } else {
                measureX = pos.x;
                measureY = pos.y;
                isDragging = true;
                dragOffsetX = 0;
                dragOffsetY = 0;
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging && !isResizing) return;
            e.preventDefault();
            const pos = getPointerPos(e);

            if (isDragging) {
                measureX = Math.max(30, Math.min(canvas.width - 30, pos.x + dragOffsetX));
                measureY = Math.max(30, Math.min(canvas.height - 30, pos.y + dragOffsetY));
            } else if (isResizing) {
                const dist = Math.hypot(pos.x - measureX, pos.y - measureY);
                measureRadius = Math.max(30, Math.min(Math.min(canvas.width, canvas.height) * 0.45, dist));
            }
        });

        window.addEventListener('pointerup', () => {
            if (isDragging && autoSnapPVC && (isVideoPlaying || staticImage)) {
                // Al soltar el dedo sobre el agujero, encaja solo en el PVC negro y analiza
                ejecutarProcesoCompleto();
            }
            isDragging = false;
            isResizing = false;
        });

        document.getElementById('btn-camera').addEventListener('click', async () => {
            staticImage = null;
            comprobacionActiva = false;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;
                await video.play();
                isVideoPlaying = true;
                statusText.textContent = "TOCA EL HUECO DE LA CELDA";
                statusText.className = "buscando";
                if (!reqAnimFrame) renderLoop();
            } catch (err) {
                alert("No se pudo abrir la cámara frontal. Revisa los permisos HTTPS.");
            }
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (video.srcObject) {
                video.srcObject.getTracks().forEach(t => t.stop());
            }
            isVideoPlaying = false;
            comprobacionActiva = false;

            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    staticImage = img;
                    statusText.textContent = "TOCA EL AGUJERO EN LA FOTO";
                    statusText.className = "buscando";
                    debugText.textContent = "Toca encima del hueco negro para auto-encajar el anillo";
                    if (!reqAnimFrame) renderLoop();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        function dibujarFotogramaBase() {
            if (isVideoPlaying && video.readyState >= 2) {
                const hRatio = canvas.width / video.videoWidth;
                const vRatio = canvas.height / video.videoHeight;
                const ratio = Math.max(hRatio, vRatio);
                const cx = (canvas.width - video.videoWidth * ratio) / 2;
                const cy = (canvas.height - video.videoHeight * ratio) / 2;

                ctx.save();
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, -cx, cy, video.videoWidth * ratio, video.videoHeight * ratio);
                ctx.restore();
                return true;
            } else if (staticImage) {
                const hRatio = canvas.width / staticImage.width;
                const vRatio = canvas.height / staticImage.height;
                const ratio = Math.min(hRatio, vRatio);
                const cx = (canvas.width - staticImage.width * ratio) / 2;
                const cy = (canvas.height - staticImage.height * ratio) / 2;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(staticImage, 0, 0, staticImage.width, staticImage.height, cx, cy, staticImage.width * ratio, staticImage.height * ratio);
                return true;
            }
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            return false;
        }

        // PASO 1: AUTO-AJUSTE AL HUECO DEL PLÁSTICO PVC NEGRO OSCURO
        function autoAjustarAlHuecoPVC() {
            dibujarFotogramaBase();

            const searchR = Math.round(measureRadius * 1.45);
            const sx = Math.max(0, Math.round(measureX - searchR));
            const sy = Math.max(0, Math.round(measureY - searchR));
            const sw = Math.min(canvas.width - sx, searchR * 2);
            const sh = Math.min(canvas.height - sy, searchR * 2);
            if (sw < 40 || sh < 40) return;

            const rgba = ctx.getImageData(sx, sy, sw, sh).data;
            const lum = new Float32Array(sw * sh);
            for (let i = 0; i < sw * sh; i++) {
                lum[i] = 0.299 * rgba[i * 4] + 0.587 * rgba[i * 4 + 1] + 0.114 * rgba[i * 4 + 2];
            }

            // 1. Medir el tono exacto del plástico PVC negro mate alrededor del hueco
            const pvcSamples = [];
            for (let y = 3; y < sh - 3; y += 2) {
                for (let x = 3; x < sw - 3; x += 2) {
                    const dist = Math.hypot((sx + x) - measureX, (sy + y) - measureY);
                    if (dist > measureRadius * 0.95 && dist < searchR * 0.95) {
                        const l = lum[y * sw + x];
                        // El PVC negro mate es oscuro (25..105) y de textura muy lisa
                        const diffLocal = Math.abs(l - lum[y * sw + (x - 2)]) + Math.abs(l - lum[(y - 2) * sw + x]);
                        if (l > 22 && l < 110 && diffLocal < 14) {
                            pvcSamples.push(l);
                        }
                    }
                }
            }

            pvcSamples.sort((a, b) => a - b);
            const pvcLum = pvcSamples.length > 10
                ? pvcSamples[Math.floor(pvcSamples.length * 0.5)]
                : 65;

            // Función que distingue si un píxel pertenece al interior del hueco (diferente del PVC mate)
            function esInteriorHueco(px, py) {
                if (px < 2 || px >= sw - 2 || py < 2 || py >= sh - 2) return false;
                const l = lum[py * sw + px];
                const grad = Math.abs(lum[py * sw + (px + 2)] - lum[py * sw + (px - 2)]) +
                             Math.abs(lum[(py + 2) * sw + px] - lum[(py - 2) * sw + px]);
                // Es hueco si es mucho más brillante (aluminio/puntos blancos), más negro (O-ring/espejo) o tiene alto contraste
                return Math.abs(l - pvcLum) > 16 || grad > 22;
            }

            // 2. Desplazar el centro automáticamente hacia el centro de masa del hueco (3 iteraciones Mean-Shift)
            let cx = measureX - sx;
            let cy = measureY - sy;
            let rEst = measureRadius;

            for (let iter = 0; iter < 3; iter++) {
                let sumX = 0, sumY = 0, count = 0;
                const scanR = rEst * 1.1;
                for (let y = Math.max(2, Math.floor(cy - scanR)); y < Math.min(sh - 2, Math.ceil(cy + scanR)); y += 2) {
                    for (let x = Math.max(2, Math.floor(cx - scanR)); x < Math.min(sw - 2, Math.ceil(cx + scanR)); x += 2) {
                        if (Math.hypot(x - cx, y - cy) <= scanR && esInteriorHueco(x, y)) {
                            sumX += x;
                            sumY += y;
                            count++;
                        }
                    }
                }
                if (count > 30) {
                    cx = cx * 0.3 + (sumX / count) * 0.7;
                    cy = cy * 0.3 + (sumY / count) * 0.7;
                }
            }

            // 3. Lanzar 64 rayos desde el centro hacia el PVC negro para medir el borde exacto del hueco
            const numRays = 64;
            const edgePoints = [];
            const maxRayR = Math.min(searchR * 0.95, Math.min(sw, sh) * 0.48);

            for (let i = 0; i < numRays; i++) {
                const ang = (i / numRays) * Math.PI * 2;
                const cosA = Math.cos(ang);
                const sinA = Math.sin(ang);

                let lastHoleR = rEst * 0.5;
                let pvcStreak = 0;

                for (let r = Math.round(rEst * 0.45); r < maxRayR; r += 2) {
                    const px = Math.round(cx + cosA * r);
                    const py = Math.round(cy + sinA * r);
                    if (esInteriorHueco(px, py)) {
                        lastHoleR = r;
                        pvcStreak = 0;
                    } else {
                        pvcStreak++;
                        // Si llevamos 4 pasos seguidos dentro del plástico PVC negro uniforme, hemos cruzado el borde
                        if (pvcStreak >= 4) break;
                    }
                }
                edgePoints.push({
                    r: lastHoleR,
                    x: cx + cosA * lastHoleR,
                    y: cy + sinA * lastHoleR
                });
            }

            // Filtrar posibles valores atípicos usando la mediana de los radios
            const sortedR = edgePoints.map(p => p.r).sort((a, b) => a - b);
            const medianR = sortedR[Math.floor(sortedR.length * 0.5)];

            let validSumX = 0, validSumY = 0, validR = 0, validCount = 0;
            for (const pt of edgePoints) {
                if (Math.abs(pt.r - medianR) < medianR * 0.25) {
                    validSumX += pt.x;
                    validSumY += pt.y;
                    validR += pt.r;
                    validCount++;
                }
            }

            if (validCount >= 20) {
                // Actualizar centro y radio al hueco real del PVC negro
                measureX = sx + cx;
                measureY = sy + cy;
                measureRadius = Math.max(32, Math.min(Math.min(canvas.width, canvas.height) * 0.42, validR / validCount));
            }
        }

        // PASO 2: DETECTAR PUNTOS BLANCOS Y COMPARAR CON EL BORDE DE PVC NEGRO
        function analizarSinAutoSnap() {
            if (!dibujarFotogramaBase()) {
                alert("Primero activa la cámara o carga una fotografía.");
                return;
            }

            const N = IMGSZ;
            const half = N / 2;
            const rPVC = half * 0.88; // El borde de PVC negro queda mapeado en rPVC
            const srcR = measureRadius / 0.88;

            roiCtx.clearRect(0, 0, N, N);
            roiCtx.drawImage(
                canvas,
                measureX - srcR, measureY - srcR, srcR * 2, srcR * 2,
                0, 0, N, N
            );

            const rgba = roiCtx.getImageData(0, 0, N, N).data;
            const rawLum = new Float32Array(N * N);
            const innerVals = [];

            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    const i = y * N + x;
                    const l = 0.299 * rgba[i * 4] + 0.587 * rgba[i * 4 + 1] + 0.114 * rgba[i * 4 + 2];
                    rawLum[i] = l;
                    if (Math.hypot(x - half, y - half) <= rPVC) {
                        innerVals.push(l);
                    }
                }
            }

            // Normalizar exposición entre el negro del PVC/espejo (percentil 5%) y los brillos (95%)
            innerVals.sort((a, b) => a - b);
            const pMin = innerVals[Math.floor(innerVals.length * 0.05)] || 0;
            const pMax = innerVals[Math.floor(innerVals.length * 0.95)] || 255;
            const dynRange = Math.max(12, pMax - pMin);

            const lum = new Float32Array(N * N);
            for (let i = 0; i < rawLum.length; i++) {
                lum[i] = Math.max(0, Math.min(255, ((rawLum[i] - pMin) / dynRange) * 255));
            }

            // Filtro Simétrico de Puntos Blancos 2D (Rechaza el reflejo grande del espejo)
            // Un punto blanco real es pequeño (radio 2..4 px) y está rodeado de oscuridad en ambos lados opuestos
            const spotCandidates = [];

            for (let y = 5; y < N - 5; y++) {
                for (let x = 5; x < N - 5; x++) {
                    const dx = x - half;
                    const dy = y - half;
                    const dist = Math.hypot(dx, dy);
                    if (dist > rPVC * 1.05 || dist < rPVC * 0.15) continue;

                    const c = lum[y * N + x];
                    if (c < 115) continue; // Debe ser un punto claro/blanco

                    // Evaluar prominencia simétrica a radio k = 3 px en 4 ejes
                    // min(c - lado1, c - lado2) da 0 en los bordes de un reflejo grande, y alto en un puntito blanco
                    let bestSym = 0;
                    for (const k of [2, 4]) {
                        const symH = Math.min(c - lum[y * N + (x - k)], c - lum[y * N + (x + k)]);
                        const symV = Math.min(c - lum[(y - k) * N + x], c - lum[(y + k) * N + x]);
                        const symD1 = Math.min(c - lum[(y - k) * N + (x - k)], c - lum[(y + k) * N + (x + k)]);
                        const symD2 = Math.min(c - lum[(y - k) * N + (x + k)], c - lum[(y + k) * N + (x - k)]);

                        const axes = [symH, symV, symD1, symD2].sort((a, b) => b - a);
                        // Al menos en 2 ejes el punto blanco debe sobresalir por ambos lados
                        const scoreK = (axes[0] + axes[1]) * 0.5;
                        if (scoreK > bestSym) bestSym = scoreK;
                    }

                    // Además, debe estar en contacto cercano con zona oscura (PVC negro o borde oscuro del espejo)
                    let minDarkNeighbor = 255;
                    for (let ny = -4; ny <= 4; ny += 2) {
                        for (let nx = -4; nx <= 4; nx += 2) {
                            const nl = lum[(y + ny) * N + (x + nx)];
                            if (nl < minDarkNeighbor) minDarkNeighbor = nl;
                        }
                    }

                    if (bestSym > 16 && minDarkNeighbor < 95) {
                        spotCandidates.push({ x, y, dx, dy, dist, score: bestSym });
                    }
                }
            }

            // Supresión de No-Máximos (minDistance = 5 px) para quedarnos con cada puntito blanco individual
            spotCandidates.sort((a, b) => b.score - a.score);
            const whiteDots = [];
            for (const cand of spotCandidates) {
                if (whiteDots.length >= 55) break;
                let close = false;
                for (const sel of whiteDots) {
                    if (Math.hypot(cand.x - sel.x, cand.y - sel.y) < 5) {
                        close = true;
                        break;
                    }
                }
                if (!close) whiteDots.push(cand);
            }

            // Clasificar los puntos blancos respecto al borde de PVC negro (rPVC)
            puntosBlancosBorde = [];
            puntosBlancosInternos = [];

            // También calculamos el centro de la zona oscura anodizada + puntos blancos para medir su desvío respecto al PVC
            let sumMemX = 0, sumMemY = 0, weightMem = 0;

            for (let y = 4; y < N - 4; y += 2) {
                for (let x = 4; x < N - 4; x += 2) {
                    const dx = x - half;
                    const dy = y - half;
                    const dist = Math.hypot(dx, dy);
                    if (dist <= rPVC * 0.95) {
                        const l = lum[y * N + x];
                        // La zona anodizada tiene fuerte contraste especular (negro profundo + reflejo vivo),
                        // a diferencia del aluminio sin anodizar que es gris intermedio plano
                        const isAnodizedZone = (l < 65 || l > 175) ? 1.0 : 0.15;
                        sumMemX += dx * isAnodizedZone;
                        sumMemY += dy * isAnodizedZone;
                        weightMem += isAnodizedZone;
                    }
                }
            }

            for (const pt of whiteDots) {
                const screenX = measureX + (pt.dx / rPVC) * measureRadius;
                const screenY = measureY + (pt.dy / rPVC) * measureRadius;

                // Si el punto blanco está situado junto al plástico negro del PVC (radio >= 65% de rPVC)
                if (pt.dist >= rPVC * 0.65) {
                    puntosBlancosBorde.push({ x: screenX, y: screenY });
                } else {
                    puntosBlancosInternos.push({ x: screenX, y: screenY });
                }
            }

            // Calcular el desvío porcentual entre el centro de la membrana y el centro del hueco de PVC negro
            const memOffsetX = weightMem > 0 ? (sumMemX / weightMem) : 0;
            const memOffsetY = weightMem > 0 ? (sumMemY / weightMem) : 0;
            const desvioPorcentaje = Math.round((Math.hypot(memOffsetX, memOffsetY) / (rPVC * 0.45)) * 100);

            centroMembrana = {
                x: measureX + (memOffsetX / rPVC) * measureRadius * 1.8,
                y: measureY + (memOffsetY / rPVC) * measureRadius * 1.8
            };

            const totalDots = puntosBlancosBorde.length + puntosBlancosInternos.length;
            const ratioEnPVC = totalDots > 0 ? Math.round((puntosBlancosBorde.length / totalDots) * 100) : 100;

            // Decisión comparando con el área de PVC negro y la tolerancia elegida
            if (desvioPorcentaje <= toleranciaMax && ratioEnPVC >= 55) {
                statusText.textContent = `✅ CENTRADA (Desvío: ${desvioPorcentaje}%)`;
                statusText.className = "centrada";
            } else {
                statusText.textContent = `❌ DESCENTRADA (Desvío: ${desvioPorcentaje}%)`;
                statusText.className = "descentrada";
            }

            debugText.textContent = `Puntos blancos junto al PVC: ${puntosBlancosBorde.length}/${totalDots} (${ratioEnPVC}%)`;
            comprobacionActiva = true;
        }

        function ejecutarProcesoCompleto() {
            if (!isVideoPlaying && !staticImage) {
                alert("Primero activa la cámara o carga una foto.");
                return;
            }
            if (autoSnapPVC) {
                autoAjustarAlHuecoPVC();
            }
            analizarSinAutoSnap();
        }

        document.getElementById('btn-comprobar').addEventListener('click', ejecutarProcesoCompleto);

        function renderLoop() {
            dibujarFotogramaBase();

            // Dibujar el borde detectado del hueco de PVC negro
            ctx.beginPath();
            ctx.arc(measureX, measureY, measureRadius, 0, 2 * Math.PI);
            ctx.strokeStyle = comprobacionActiva
                ? (statusText.className === 'centrada' ? '#32d74b' : '#ff453a')
                : '#0a84ff';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Si se ha comprobado, mostrar los puntos blancos detectados junto al PVC
            if (comprobacionActiva) {
                // Puntos blancos situados correctamente junto al plástico negro (Cian brillante)
                ctx.fillStyle = '#00f5d4';
                for (const p of puntosBlancosBorde) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Puntos blancos desviados hacia el interior (Naranja)
                ctx.fillStyle = '#ff9f0a';
                for (const p of puntosBlancosInternos) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Si está descentrada, mostrar vector desde el centro de la membrana al centro del hueco PVC
                if (statusText.className === 'descentrada' && centroMembrana) {
                    ctx.strokeStyle = '#ff453a';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(measureX, measureY);
                    ctx.lineTo(centroMembrana.x, centroMembrana.y);
                    ctx.stroke();
                }
            }

            // Cruceta central del hueco de PVC
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(measureX - 6, measureY);
            ctx.lineTo(measureX + 6, measureY);
            ctx.moveTo(measureX, measureY - 6);
            ctx.lineTo(measureX, measureY + 6);
            ctx.stroke();

            // Tirador amarillo lateral por si el usuario quiere retocar el tamaño a mano
            ctx.beginPath();
            ctx.arc(measureX + measureRadius, measureY, 12, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffd60a';
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();

            reqAnimFrame = requestAnimationFrame(renderLoop);
        }

        renderLoop();
    </script>
</body>
</html>
