<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alineador NAA - Control de Centrado</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #18181b;
            --text-color: #ffffff;
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --success-color: #32d74b;
            --warning-color: #ffd60a;
            --cyan-color: #00f5d4;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #header {
            width: 100%;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            z-index: 20;
            flex-shrink: 0;
            border-bottom: 1px solid #27272a;
        }

        h1 { margin: 0; font-size: 0.95rem; font-weight: 600; }

        #main-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            background-color: #000;
            overflow: hidden;
        }

        #video-element { display: none; }

        #main-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        #status-overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(15, 15, 20, 0.92);
            padding: 12px 16px;
            border-radius: 12px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.18);
            width: 92%;
            max-width: 395px;
        }

        #status-text {
            font-size: 1.35rem;
            font-weight: 800;
            margin: 0;
        }

        #status-text.centrada { color: var(--success-color); }
        #status-text.descentrada { color: var(--danger-color); }
        #status-text.buscando { color: var(--warning-color); font-size: 1.05rem; }

        #pct-pvc-text {
            font-size: 1.05rem;
            font-weight: 700;
            margin: 6px 0 2px 0;
            color: var(--cyan-color);
        }

        .instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 94%;
            text-align: center;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.95);
            background: rgba(0,0,0,0.75);
            padding: 7px 12px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 10;
        }

        #controls {
            width: 100%;
            background-color: var(--panel-bg);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            flex-shrink: 0;
            border-top: 1px solid #27272a;
        }

        .param-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: #d4d4d8;
        }

        .param-bar input[type="range"] {
            flex: 1;
            accent-color: var(--accent-color);
        }

        .row-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: #27272a;
            color: white;
            border: 1px solid #3f3f46;
            padding: 10px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .btn.active-mode {
            background-color: #1d4ed8;
            border-color: #3b82f6;
        }

        .btn-check {
            background-color: var(--accent-color);
            border: none;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 14px;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 10px rgba(10, 132, 255, 0.35);
        }

        .btn:active { transform: scale(0.98); filter: brightness(0.9); }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="header">
        <h1>🔬 Alineador NAA</h1>
        <span style="font-size: 0.75rem; color: #00f5d4;">● Borde alumina &nbsp; <span style="color:#ff453a;">● Aluminio</span></span>
    </div>

    <div id="main-container">
        <video id="video-element" autoplay playsinline muted></video>
        <canvas id="main-canvas"></canvas>

        <div id="status-overlay">
            <p id="status-text" class="buscando">TOCA EL AGUJERO Y PULSA COMPROBAR</p>
            <p id="pct-pvc-text">Borde alumina: --%</p>
            <p id="debug-text" style="font-size: 0.75rem; margin: 2px 0 0 0; color:#cbd5e1;">
                Detección de aluminio sin anodizar
            </p>
        </div>

        <div id="inst-text" class="instructions">
            👆 Toca el hueco negro para encajar el círculo o arrástralo
        </div>
    </div>

    <div id="controls">
        <div class="param-bar">
            <span>Exigencia mínima de Borde:</span>
            <input type="range" id="slider-min-pvc" min="35" max="85" value="55">
            <span id="val-min-pvc">55%</span>
        </div>
        <button id="btn-comprobar" class="btn btn-check">COMPROBAR</button>
        <div class="row-buttons">
            <button id="btn-autosnap" class="btn active-mode">🧲 Auto-PVC: ON</button>
            <button id="btn-camera" class="btn">📷 Cámara</button>
            <!-- El método onclick directo es el más compatible con todos los navegadores de ordenador -->
            <button id="btn-image" class="btn" onclick="document.getElementById('file-input').click()">📁 Foto</button>
        </div>
        <!-- Al hacer click se limpia el value para permitir subir la misma foto varias veces -->
        <input type="file" id="file-input" accept="image/*" onclick="this.value = null;">
    </div>

    <script>
        const video = document.getElementById('video-element');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusText = document.getElementById('status-text');
        const pctPvcText = document.getElementById('pct-pvc-text');
        const debugText = document.getElementById('debug-text');
        const sliderMinPvc = document.getElementById('slider-min-pvc');
        const valMinPvc = document.getElementById('val-min-pvc');
        const btnAutoSnap = document.getElementById('btn-autosnap');
        const fileInput = document.getElementById('file-input');

        const IMGSZ = 160;
        const roiCanvas = document.createElement('canvas');
        roiCanvas.width = IMGSZ;
        roiCanvas.height = IMGSZ;
        const roiCtx = roiCanvas.getContext('2d', { willReadFrequently: true });

        let isVideoPlaying = false;
        let staticImage = null;
        let reqAnimFrame = null;

        let measureX = 0;
        let measureY = 0;
        let measureRadius = 70;

        let autoSnapPVC = true;
        let minPorcentajePVC = 55; // Nivel de exigencia flexible (Luna creciente admisible)

        let isDragging = false;
        let isResizing = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        let comprobacionActiva = false;
        let puntosBordeAlumina = [];
        let puntosAluminio = [];

        sliderMinPvc.addEventListener('input', (e) => {
            minPorcentajePVC = parseInt(e.target.value, 10);
            valMinPvc.textContent = minPorcentajePVC + '%';
            if (comprobacionActiva) analizarMuestra();
        });

        btnAutoSnap.addEventListener('click', () => {
            autoSnapPVC = !autoSnapPVC;
            btnAutoSnap.textContent = `🧲 Auto-PVC: ${autoSnapPVC ? 'ON' : 'OFF'}`;
            btnAutoSnap.classList.toggle('active-mode', autoSnapPVC);
        });

        function resizeCanvas() {
            const container = document.getElementById('main-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            if (measureX === 0 && canvas.width > 0) {
                measureX = canvas.width / 2;
                measureY = canvas.height / 2;
                measureRadius = Math.min(canvas.width, canvas.height) * 0.22;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 80);

        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            const pos = getPointerPos(e);
            const dist = Math.hypot(pos.x - measureX, pos.y - measureY);

            comprobacionActiva = false;

            if (Math.abs(dist - measureRadius) < 35 && Math.abs(pos.x - (measureX + measureRadius)) < 40) {
                isResizing = true;
                return;
            }

            if (dist < measureRadius * 1.1) {
                isDragging = true;
                dragOffsetX = measureX - pos.x;
                dragOffsetY = measureY - pos.y;
            } else {
                measureX = pos.x;
                measureY = pos.y;
                isDragging = true;
                dragOffsetX = 0;
                dragOffsetY = 0;
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDragging && !isResizing) return;
            e.preventDefault();
            const pos = getPointerPos(e);

            if (isDragging) {
                measureX = Math.max(30, Math.min(canvas.width - 30, pos.x + dragOffsetX));
                measureY = Math.max(30, Math.min(canvas.height - 30, pos.y + dragOffsetY));
            } else if (isResizing) {
                const dist = Math.hypot(pos.x - measureX, pos.y - measureY);
                measureRadius = Math.max(30, Math.min(Math.min(canvas.width, canvas.height) * 0.45, dist));
            }
        });

        window.addEventListener('pointerup', () => {
            if (isDragging && autoSnapPVC && (isVideoPlaying || staticImage)) {
                autoAjustarAlHuecoPVC();
            }
            isDragging = false;
            isResizing = false;
        });

        document.getElementById('btn-camera').addEventListener('click', async () => {
            staticImage = null;
            comprobacionActiva = false;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;
                await video.play();
                isVideoPlaying = true;
                statusText.textContent = "CÁMARA LISTA - PULSA COMPROBAR";
                statusText.className = "buscando";
                if (!reqAnimFrame) renderLoop();
            } catch (err) {
                alert("No se pudo abrir la cámara frontal. Revisa permisos.");
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Bloqueo de seguridad: Evitar error en navegadores de PC al detener la cámara
            if (video.srcObject && typeof video.srcObject.getTracks === 'function') {
                video.srcObject.getTracks().forEach(t => t.stop());
                video.srcObject = null;
            }
            isVideoPlaying = false;
            comprobacionActiva = false;

            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    staticImage = img;
                    statusText.textContent = "TOCA EL AGUJERO Y PULSA COMPROBAR";
                    statusText.className = "buscando";
                    pctPvcText.textContent = "Borde alumina: --%";
                    if (!reqAnimFrame) renderLoop();
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        function dibujarFotogramaBase() {
            if (isVideoPlaying && video.readyState >= 2) {
                const hRatio = canvas.width / video.videoWidth;
                const vRatio = canvas.height / video.videoHeight;
                const ratio = Math.max(hRatio, vRatio);
                const cx = (canvas.width - video.videoWidth * ratio) / 2;
                const cy = (canvas.height - video.videoHeight * ratio) / 2;

                ctx.save();
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight, -cx, cy, video.videoWidth * ratio, video.videoHeight * ratio);
                ctx.restore();
                return true;
            } else if (staticImage) {
                const hRatio = canvas.width / staticImage.width;
                const vRatio = canvas.height / staticImage.height;
                const ratio = Math.min(hRatio, vRatio);
                const cx = (canvas.width - staticImage.width * ratio) / 2;
                const cy = (canvas.height - staticImage.height * ratio) / 2;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(staticImage, 0, 0, staticImage.width, staticImage.height, cx, cy, staticImage.width * ratio, staticImage.height * ratio);
                return true;
            }
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            return false;
        }

        function autoAjustarAlHuecoPVC() {
            dibujarFotogramaBase();

            const searchR = Math.round(measureRadius * 1.45);
            const sx = Math.max(0, Math.round(measureX - searchR));
            const sy = Math.max(0, Math.round(measureY - searchR));
            const sw = Math.min(canvas.width - sx, searchR * 2);
            const sh = Math.min(canvas.height - sy, searchR * 2);
            if (sw < 40 || sh < 40) return;

            const rgba = ctx.getImageData(sx, sy, sw, sh).data;
            const lum = new Float32Array(sw * sh);
            for (let i = 0; i < sw * sh; i++) {
                lum[i] = 0.299 * rgba[i * 4] + 0.587 * rgba[i * 4 + 1] + 0.114 * rgba[i * 4 + 2];
            }

            const pvcSamples = [];
            for (let y = 3; y < sh - 3; y += 2) {
                for (let x = 3; x < sw - 3; x += 2) {
                    const dist = Math.hypot((sx + x) - measureX, (sy + y) - measureY);
                    if (dist > measureRadius * 0.95 && dist < searchR * 0.95) {
                        const l = lum[y * sw + x];
                        const diffLocal = Math.abs(l - lum[y * sw + (x - 2)]) + Math.abs(l - lum[(y - 2) * sw + x]);
                        if (l > 15 && l < 115 && diffLocal < 18) pvcSamples.push(l);
                    }
                }
            }

            pvcSamples.sort((a, b) => a - b);
            const pvcLum = pvcSamples.length > 10 ? pvcSamples[Math.floor(pvcSamples.length * 0.5)] : 60;

            function esInteriorHueco(px, py) {
                if (px < 2 || px >= sw - 2 || py < 2 || py >= sh - 2) return false;
                const l = lum[py * sw + px];
                const grad = Math.abs(lum[py * sw + (px + 2)] - lum[py * sw + (px - 2)]) + Math.abs(lum[(py + 2) * sw + px] - lum[(py - 2) * sw + px]);
                return Math.abs(l - pvcLum) > 15 || grad > 25;
            }

            let cx = measureX - sx;
            let cy = measureY - sy;
            let rEst = measureRadius;

            for (let iter = 0; iter < 3; iter++) {
                let sumX = 0, sumY = 0, count = 0;
                const scanR = rEst * 1.1;
                for (let y = Math.max(2, Math.floor(cy - scanR)); y < Math.min(sh - 2, Math.ceil(cy + scanR)); y += 2) {
                    for (let x = Math.max(2, Math.floor(cx - scanR)); x < Math.min(sw - 2, Math.ceil(cx + scanR)); x += 2) {
                        if (Math.hypot(x - cx, y - cy) <= scanR && esInteriorHueco(x, y)) {
                            sumX += x; sumY += y; count++;
                        }
                    }
                }
                if (count > 30) {
                    cx = cx * 0.3 + (sumX / count) * 0.7;
                    cy = cy * 0.3 + (sumY / count) * 0.7;
                }
            }

            const numRays = 64;
            const edgePoints = [];
            const maxRayR = Math.min(searchR * 0.95, Math.min(sw, sh) * 0.48);

            for (let i = 0; i < numRays; i++) {
                const ang = (i / numRays) * Math.PI * 2;
                const cosA = Math.cos(ang);
                const sinA = Math.sin(ang);
                let lastHoleR = rEst * 0.5;
                let pvcStreak = 0;

                for (let r = Math.round(rEst * 0.45); r < maxRayR; r += 2) {
                    const px = Math.round(cx + cosA * r);
                    const py = Math.round(cy + sinA * r);
                    if (esInteriorHueco(px, py)) {
                        lastHoleR = r;
                        pvcStreak = 0;
                    } else {
                        pvcStreak++;
                        if (pvcStreak >= 4) break;
                    }
                }
                edgePoints.push({ r: lastHoleR });
            }

            const sortedR = edgePoints.map(p => p.r).sort((a, b) => a - b);
            const medianR = sortedR[Math.floor(sortedR.length * 0.5)];
            let validR = 0, validCount = 0;
            for (const pt of edgePoints) {
                if (Math.abs(pt.r - medianR) < medianR * 0.25) {
                    validR += pt.r; validCount++;
                }
            }
            if (validCount >= 20) {
                measureX = sx + cx; measureY = sy + cy;
                measureRadius = Math.max(32, Math.min(Math.min(canvas.width, canvas.height) * 0.42, validR / validCount));
            }
        }

        function analizarMuestra() {
            if (!dibujarFotogramaBase()) {
                alert("Primero activa la cámara o carga una fotografía.");
                return;
            }

            const N = IMGSZ;
            const half = N / 2;
            const rPVC = half * 0.88;
            const srcR = measureRadius / 0.88;

            roiCtx.clearRect(0, 0, N, N);
            roiCtx.drawImage(canvas, measureX - srcR, measureY - srcR, srcR * 2, srcR * 2, 0, 0, N, N);

            const rgba = roiCtx.getImageData(0, 0, N, N).data;
            const rawLum = new Float32Array(N * N);
            const innerVals = [];
            const pvcRingVals = [];

            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    const i = y * N + x;
                    const l = 0.299 * rgba[i * 4] + 0.587 * rgba[i * 4 + 1] + 0.114 * rgba[i * 4 + 2];
                    rawLum[i] = l;
                    const d = Math.hypot(x - half, y - half);
                    if (d <= rPVC) {
                        innerVals.push(l);
                    } else if (d > rPVC * 1.03 && d < rPVC * 1.13) {
                        pvcRingVals.push(l);
                    }
                }
            }

            innerVals.sort((a, b) => a - b);
            const pMin = innerVals[Math.floor(innerVals.length * 0.05)] || 0;
            const pMax = innerVals[Math.floor(innerVals.length * 0.95)] || 255;
            const dynRange = Math.max(12, pMax - pMin);

            const lum = new Float32Array(N * N);
            for (let i = 0; i < rawLum.length; i++) {
                lum[i] = Math.max(0, Math.min(255, ((rawLum[i] - pMin) / dynRange) * 255));
            }

            pvcRingVals.sort((a, b) => a - b);
            const rawPvcMedian = pvcRingVals.length > 0 ? pvcRingVals[Math.floor(pvcRingVals.length * 0.5)] : pMin + 22;
            const normPvcLum = Math.max(0, Math.min(255, ((rawPvcMedian - pMin) / dynRange) * 255));

            function getLum(px, py) {
                const ix = Math.max(1, Math.min(N - 2, Math.round(px)));
                const iy = Math.max(1, Math.min(N - 2, Math.round(py)));
                return lum[iy * N + ix];
            }

            const numAngles = 64; 
            const rMinSearch = Math.round(rPVC * 0.55);
            const rMaxSearch = Math.round(rPVC * 1.02);

            puntosBordeAlumina = [];
            puntosAluminio = [];

            for (let a = 0; a < numAngles; a++) {
                const theta = (a / numAngles) * Math.PI * 2;
                const cosT = Math.cos(theta);
                const sinT = Math.sin(theta);

                let bestR = -1;
                let bestPeakScore = 0;

                for (let r = rMinSearch; r <= rMaxSearch; r++) {
                    const cx = half + cosT * r;
                    const cy = half + sinT * r;
                    const c = getLum(cx, cy);

                    if (c < 100) continue;

                    const lIn4 = getLum(half + cosT * (r - 4), half + sinT * (r - 4));
                    const lIn7 = getLum(half + cosT * (r - 7), half + sinT * (r - 7));
                    const lOut3 = getLum(half + cosT * (r + 3), half + sinT * (r + 3));
                    const lOut5 = getLum(half + cosT * (r + 5), half + sinT * (r + 5));

                    const dropIn = Math.max(c - lIn4, c - lIn7);
                    const dropOut = Math.max(c - lOut3, c - lOut5);

                    // Evita destellos centrales y falsos reflejos (caída suave hacia el centro no vale)
                    const lDeepIn = (getLum(half + cosT * (r - 5), half + sinT * (r - 5)) + getLum(half + cosT * (r - 9), half + sinT * (r - 9))) / 2;
                    if (lDeepIn > 190 && lDeepIn >= c - 10) continue;

                    if (dropIn > 12 && dropOut > 12) {
                        const peakScore = Math.min(dropIn, dropOut) + (dropIn + dropOut) * 0.3;
                        if (peakScore > bestPeakScore) {
                            bestPeakScore = peakScore;
                            bestR = r;
                        }
                    }
                }

                if (bestR > 0 && bestPeakScore > 15) {
                    const gapHastaPVC = rPVC - bestR;
                    let sumaGrisDetras = 0, sumaGradienteDetras = 0, muestrasDetras = 0;

                    for (let rOut = bestR + 3; rOut <= rPVC - 1.5; rOut += 1.5) {
                        const lOut = getLum(half + cosT * rOut, half + sinT * rOut);
                        const lNext = getLum(half + cosT * (rOut + 1.5), half + sinT * (rOut + 1.5));
                        sumaGrisDetras += lOut;
                        sumaGradienteDetras += Math.abs(lOut - lNext);
                        muestrasDetras++;
                    }

                    const mediaDetras = muestrasDetras > 0 ? (sumaGrisDetras / muestrasDetras) : normPvcLum;
                    const rugosidadDetras = muestrasDetras > 0 ? (sumaGradienteDetras / muestrasDetras) : 0;

                    // Detección de Aluminio (Grisáceo intermedio)
                    const hayAluminioDetras = (gapHastaPVC >= 4.5) && (muestrasDetras >= 2) && 
                                              (mediaDetras > Math.max(65, normPvcLum + 12)) && 
                                              (mediaDetras < 220) && (rugosidadDetras < 35);

                    const screenX = measureX + ((cosT * bestR) / rPVC) * measureRadius;
                    const screenY = measureY + ((sinT * bestR) / rPVC) * measureRadius;

                    if (hayAluminioDetras) {
                        puntosAluminio.push({ x: screenX, y: screenY, angleIndex: a });
                    } else if (gapHastaPVC <= 10) {
                        puntosBordeAlumina.push({ x: screenX, y: screenY, angleIndex: a });
                    }
                }
            }

            const numBordeAlumina = puntosBordeAlumina.length;
            const numAluminio = puntosAluminio.length;
            const totalPuntos = numBordeAlumina + numAluminio;
            const porcentajePVC = totalPuntos > 0 ? Math.round((numBordeAlumina / totalPuntos) * 100) : 0;

            pctPvcText.textContent = `Borde
