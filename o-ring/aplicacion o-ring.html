<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NAA Align - Centrado de Membranas de Alúmina</title>
  <style>
    :root {
      --bg-dark: #111827;
      --panel-bg: #1f2937;
      --text-main: #f9fafb;
      --accent: #3b82f6;
      --red: #ef4444;
      --amber: #f59e0b;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      transition: background-color 0.3s ease;
    }
    /* Modo linterna coaxial (pantalla blanca para iluminar el O-ring desde abajo) */
    body.torch-mode {
      background-color: #ffffff !important;
      color: #111827 !important;
    }
    body.torch-mode .controls-panel {
      background-color: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
    }
    header {
      width: 100%;
      max-width: 540px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 1.1rem; font-weight: 700; }
    .status-badge {
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.85rem;
      background: var(--red);
      color: white;
      transition: background 0.2s;
    }
    .viewport-container {
      position: relative;
      width: 100%;
      max-width: 540px;
      aspect-ratio: 3 / 4;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      touch-action: none;
    }
    video { display: none; }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }
    .hud-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .metric-box {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      line-height: 1.4;
      color: #e5e7eb;
    }
    .controls-panel {
      width: 100%;
      max-width: 540px;
      background: var(--panel-bg);
      border-radius: 14px;
      padding: 14px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button, .file-label {
      flex: 1;
      min-width: 110px;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.15s;
    }
    button:hover, .file-label:hover { opacity: 0.9; }
    button.secondary { background: #4b5563; }
    button.active-toggle { background: var(--green); }
    input[type="file"] { display: none; }
    .slider-group {
      display: grid;
      grid-template-columns: 130px 1fr 45px;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .hint { font-size: 0.75rem; opacity: 0.8; text-align: center; margin-top: 2px; }
  </style>
</head>
<body>

  <header>
    <h1>🔬 NAA O-Ring Aligner</h1>
    <div id="statusBadge" class="status-badge">DESCENTRADA</div>
  </header>

  <div class="viewport-container">
    <video id="videoFeed" playsinline autoplay muted></video>
    <canvas id="mainCanvas" width="480" height="640"></canvas>
    <div class="hud-overlay">
      <div class="metric-box">
        <div>Centrado: <strong id="scoreVal">0%</strong></div>
        <div>Intrusión Centro: <span id="coreVal">0</span></div>
        <div>Puntos Corona: <span id="ringVal">0</span></div>
      </div>
      <div class="metric-box" id="guideText">
        Coloca la muestra en el O-ring
      </div>
    </div>
  </div>

  <div class="controls-panel">
    <div class="btn-row">
      <button id="btnCamera">📷 Cámara Frontal</button>
      <label class="file-label" for="fileInput">📁 Probar con Foto</label>
      <input type="file" id="fileInput" accept="image/*">
      <button id="btnSim" class="secondary">🧪 Simulador NAA</button>
    </div>

    <div class="btn-row">
      <button id="btnTorch" class="secondary">💡 Luz Coaxial Pantalla</button>
      <button id="btnMirror" class="secondary active-toggle">🪞 Espejo: ON</button>
      <button id="btnEdges" class="secondary">👁️ Ver Filtro Puntos</button>
    </div>

    <hr style="border: 0; border-top: 1px solid rgba(156,163,175,0.2);">

    <div class="slider-group">
      <label>Radio O-Ring (px):</label>
      <input type="range" id="sliderR" min="30" max="180" value="75">
      <span id="valR">75</span>
    </div>
    <div class="slider-group">
      <label>Posición X O-Ring:</label>
      <input type="range" id="sliderX" min="60" max="420" value="200">
      <span id="valX">200</span>
    </div>
    <div class="slider-group">
      <label>Posición Y O-Ring:</label>
      <input type="range" id="sliderY" min="60" max="580" value="345">
      <span id="valY">345</span>
    </div>
    <div class="slider-group">
      <label>Sensibilidad Puntos:</label>
      <input type="range" id="sliderThresh" min="10" max="100" value="38">
      <span id="valThresh">38</span>
    </div>
    <div class="slider-group">
      <label>Umbral Verde (%):</label>
      <input type="range" id="sliderGreen" min="50" max="95" value="78">
      <span id="valGreen">78%</span>
    </div>
    <p class="hint">💡 En modo Foto o Simulador, arrastra sobre la imagen para mover la muestra respecto al O-ring.</p>
  </div>

  <script>
    const video = document.getElementById('videoFeed');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Canvas oculto para procesamiento de píxeles
    const procCanvas = document.createElement('canvas');
    procCanvas.width = canvas.width;
    procCanvas.height = canvas.height;
    const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

    // Estado de la aplicación
    let mode = 'simulator'; // 'camera' | 'image' | 'simulator'
    let mirrorMode = true;
    let showEdgeOverlay = false;
    let uploadedImg = null;

    // Coordenadas de la muestra en modo Simulador / Imagen (para arrastrar y probar)
    let sampleOffset = { x: 32, y: -28 }; // Empieza descentrada para demostrar el cambio Rojo -> Verde
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };

    // Parámetros del O-Ring
    const params = {
      x: 200,
      y: 345,
      r: 75,
      edgeThreshold: 38,
      greenScoreThreshold: 78
    };

    // Referencias UI
    const statusBadge = document.getElementById('statusBadge');
    const scoreVal = document.getElementById('scoreVal');
    const coreVal = document.getElementById('coreVal');
    const ringVal = document.getElementById('ringVal');
    const guideText = document.getElementById('guideText');

    // Vinculación de Sliders
    function bindSlider(id, valId, key, suffix = '') {
      const slider = document.getElementById(id);
      const label = document.getElementById(valId);
      slider.addEventListener('input', (e) => {
        params[key] = parseFloat(e.target.value);
        label.textContent = params[key] + suffix;
      });
    }
    bindSlider('sliderR', 'valR', 'r');
    bindSlider('sliderX', 'valX', 'x');
    bindSlider('sliderY', 'valY', 'y');
    bindSlider('sliderThresh', 'valThresh', 'edgeThreshold');
    bindSlider('sliderGreen', 'valGreen', 'greenScoreThreshold', '%');

    // Botón Cámara Frontal
    document.getElementById('btnCamera').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        mode = 'camera';
      } catch (err) {
        alert('No se pudo acceder a la cámara frontal. Asegúrate de abrir en localhost o HTTPS. Error: ' + err.message);
      }
    });

    // Subir foto real del laboratorio
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          uploadedImg = img;
          sampleOffset = { x: 0, y: 0 };
          mode = 'image';
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Botón Simulador Sintético NAA
    document.getElementById('btnSim').addEventListener('click', () => {
      mode = 'simulator';
      sampleOffset = { x: 28, y: -24 }; // Descentrada inicialmente
    });

    // Botón Luz Coaxial
    document.getElementById('btnTorch').addEventListener('click', (e) => {
      document.body.classList.toggle('torch-mode');
      e.target.classList.toggle('active-toggle');
    });

    // Botón Espejo
    document.getElementById('btnMirror').addEventListener('click', (e) => {
      mirrorMode = !mirrorMode;
      e.target.textContent = `🪞 Espejo: ${mirrorMode ? 'ON' : 'OFF'}`;
      e.target.classList.toggle('active-toggle', mirrorMode);
    });

    // Botón Ver Filtro de Puntos Blancos
    document.getElementById('btnEdges').addEventListener('click', (e) => {
      showEdgeOverlay = !showEdgeOverlay;
      e.target.classList.toggle('active-toggle', showEdgeOverlay);
    });

    // Eventos para arrastrar la muestra en modo Simulador / Foto
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      const pos = getPointerPos(e);
      dragStart = { x: pos.x - sampleOffset.x, y: pos.y - sampleOffset.y };
    });
    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const pos = getPointerPos(e);
      sampleOffset.x = pos.x - dragStart.x;
      sampleOffset.y = pos.y - dragStart.y;
    });
    window.addEventListener('pointerup', () => { isDragging = false; });

    // Dibuja una simulación realista de la celda negra + aluminio + puntitos blancos de anodización
    function drawSyntheticSample(targetCtx) {
      const cx = params.x;
      const cy = params.y;
      const r = params.r;

      // 1. Fondo negro de la celda de teflón/polímero
      targetCtx.fillStyle = '#22252a';
      targetCtx.fillRect(0, 0, canvas.width, canvas.height);

      // Agujeros vecinos iluminados (como en las fotos reales)
      targetCtx.fillStyle = '#f3f4f6';
      targetCtx.beginPath();
      targetCtx.arc(cx + 110, cy - 160, r * 0.95, 0, Math.PI * 2);
      targetCtx.arc(cx - 80, cy - 230, r * 0.92, 0, Math.PI * 2);
      targetCtx.fill();

      // 2. Recorte del agujero del O-ring activo
      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.arc(cx, cy, r, 0, Math.PI * 2);
      targetCtx.clip();

      // Centro de la zona anodizada de la muestra (desplazada por sampleOffset)
      const sx = cx + sampleOffset.x;
      const sy = cy + sampleOffset.y;
      const anodR = r * 0.92; // Radio de la primera anodización

      // 3. Aluminio opaco exterior (no anodizado)
      targetCtx.fillStyle = '#868e96';
      targetCtx.fillRect(cx - r, cy - r, r * 2, r * 2);

      // 4. Círculo central brillante (alúmina anodizada especular)
      const grad = targetCtx.createRadialGradient(sx - 15, sy - 15, 5, sx, sy, anodR);
      grad.addColorStop(0, '#e9ecef');
      grad.addColorStop(0.5, '#343a40'); // Reflejo oscuro de la cámara
      grad.addColorStop(0.85, '#adb5bd');
      grad.addColorStop(1, '#dee2e6');
      targetCtx.fillStyle = grad;
      targetCtx.beginPath();
      targetCtx.arc(sx, sy, anodR, 0, Math.PI * 2);
      targetCtx.fill();

      // 5. Escalón y "puntitos blancos" característicos en el perímetro de la 1ª anodización
      const numDots = 48;
      for (let i = 0; i < numDots; i++) {
        const angle = (i / numDots) * Math.PI * 2;
        const jitter = (Math.sin(i * 12.9898) * 1.5);
        const dx = sx + Math.cos(angle) * (anodR - 1 + jitter);
        const dy = sy + Math.sin(angle) * (anodR - 1 + jitter);
        targetCtx.fillStyle = '#ffffff';
        targetCtx.beginPath();
        targetCtx.arc(dx, dy, 2.1, 0, Math.PI * 2);
        targetCtx.fill();
      }

      targetCtx.restore();
    }

    // Algoritmo de Visión Clásica: Evaluación de Corona vs. Núcleo Central
    function analyzeAlignment() {
      const cx = Math.round(params.x);
      const cy = Math.round(params.y);
      const r = Math.round(params.r);

      const x0 = Math.max(1, cx - r - 4);
      const y0 = Math.max(1, cy - r - 4);
      const x1 = Math.min(canvas.width - 2, cx + r + 4);
      const y1 = Math.min(canvas.height - 2, cy + r + 4);
      const w = x1 - x0;
      const h = y1 - y0;

      const imgData = procCtx.getImageData(x0, y0, w, h);
      const data = imgData.data;

      // Límites radiales:
      // Core (Núcleo interior): 0 a 0.74 * R -> NO debe tener el borde de puntitos blancos
      // Ring (Corona perimetral): 0.74 * R a 0.97 * R -> DEBE contener el contorno de puntitos blancos
      const rCoreMax = r * 0.74;
      const rRingMin = r * 0.74;
      const rRingMax = r * 0.97;

      let coreEdgeHits = 0;
      let coreTotalPixels = 0;
      let ringEdgeHits = 0;
      let ringTotalPixels = 0;

      // Acumuladores de centro de masa de bordes intrusos para indicar hacia dónde mover la muestra
      let intrudeX = 0;
      let intrudeY = 0;

      // Cuadrantes perimetrales para verificar simetría
      const quadrants = [0, 0, 0, 0];

      for (let py = 1; py < h - 1; py++) {
        for (let px = 1; px < w - 1; px++) {
          const dx = (x0 + px) - cx;
          const dy = (y0 + py) - cy;
          const dist = Math.hypot(dx, dy);

          if (dist > rRingMax) continue;

          const idx = (py * w + px) * 4;
          const lumCenter = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];

          // Filtro Laplaciano de alta frecuencia (detecta "puntitos blancos" y saltos bruscos de borde)
          const idxLeft = (py * w + (px - 1)) * 4;
          const idxRight = (py * w + (px + 1)) * 4;
          const idxUp = ((py - 1) * w + px) * 4;
          const idxDown = ((py + 1) * w + px) * 4;

          const lumNeighbors = (
            (0.299 * data[idxLeft] + 0.587 * data[idxLeft + 1] + 0.114 * data[idxLeft + 2]) +
            (0.299 * data[idxRight] + 0.587 * data[idxRight + 1] + 0.114 * data[idxRight + 2]) +
            (0.299 * data[idxUp] + 0.587 * data[idxUp + 1] + 0.114 * data[idxUp + 2]) +
            (0.299 * data[idxDown] + 0.587 * data[idxDown + 1] + 0.114 * data[idxDown + 2])
          ) * 0.25;

          const highFreqResponse = Math.abs(lumCenter - lumNeighbors);
          const isWhiteDotOrStep = highFreqResponse > (params.edgeThreshold * 0.45) && lumCenter > 95;

          if (dist < rCoreMax) {
            coreTotalPixels++;
            if (isWhiteDotOrStep) {
              coreEdgeHits++;
              intrudeX += dx;
              intrudeY += dy;
              if (showEdgeOverlay) {
                // Pintar en rojo los puntos intrusos dentro del núcleo
                ctx.fillStyle = 'rgba(239, 68, 68, 0.85)';
                ctx.fillRect(x0 + px, y0 + py, 2, 2);
              }
            }
          } else if (dist >= rRingMin && dist <= rRingMax) {
            ringTotalPixels++;
            if (isWhiteDotOrStep) {
              ringEdgeHits++;
              const qIdx = (dx >= 0 ? 1 : 0) + (dy >= 0 ? 2 : 0);
              quadrants[qIdx]++;
              if (showEdgeOverlay) {
                // Pintar en cian/verde los puntos blancos situados correctamente en la corona
                ctx.fillStyle = 'rgba(16, 185, 129, 0.85)';
                ctx.fillRect(x0 + px, y0 + py, 2, 2);
              }
            }
          }
        }
      }

      // Cálculo del índice de centrado (0 a 100%)
      const coreDensity = coreTotalPixels > 0 ? (coreEdgeHits / coreTotalPixels) * 100 : 0;
      const ringDensity = ringTotalPixels > 0 ? (ringEdgeHits / ringTotalPixels) * 100 : 0;

      // Cuántos cuadrantes de la corona tienen presencia de borde/puntos
      const activeQuadrants = quadrants.filter(q => q > 3).length;
      const symmetryBonus = (activeQuadrants / 4) * 35;

      // Penalización fuerte si el arco de puntos blancos atraviesa el núcleo central (como en las fotos descentradas)
      const corePenalty = Math.min(75, coreDensity * 22);
      const ringReward = Math.min(65, ringDensity * 14);

      let score = Math.round(Math.max(0, Math.min(100, ringReward + symmetryBonus - corePenalty)));

      // Si no hay apenas señal en absoluto (agujero vacío), limitar puntuación
      if (ringEdgeHits < 8 && coreEdgeHits < 5) {
        score = 0;
      }

      return {
        score,
        coreHits: coreEdgeHits,
        ringHits: ringEdgeHits,
        intrudeVec: coreEdgeHits > 10 ? { x: intrudeX / coreEdgeHits, y: intrudeY / coreEdgeHits } : null
      };
    }

    function renderLoop() {
      procCtx.save();
      if (mode === 'camera' && video.readyState >= 2) {
        if (mirrorMode) {
          procCtx.translate(canvas.width, 0);
          procCtx.scale(-1, 1);
        }
        procCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
      } else if (mode === 'image' && uploadedImg) {
        procCtx.fillStyle = '#000';
        procCtx.fillRect(0, 0, canvas.width, canvas.height);
        procCtx.drawImage(uploadedImg, sampleOffset.x, sampleOffset.y, canvas.width, canvas.height);
      } else {
        drawSyntheticSample(procCtx);
      }
      procCtx.restore();

      // Copiar frame base al canvas visible
      ctx.drawImage(procCanvas, 0, 0);

      // Ejecutar análisis de centrado sin IA
      const result = analyzeAlignment();

      // Determinar color del Halo (Rojo vs Ámbar vs Verde)
      let haloColor = '#ef4444'; // Rojo por defecto
      let statusText = 'DESCENTRADA';

      if (result.score >= params.greenScoreThreshold) {
        haloColor = '#10b981'; // Verde (Centrada)
        statusText = '✓ CENTRADA (OK)';
      } else if (result.score >= params.greenScoreThreshold - 20) {
        haloColor = '#f59e0b'; // Ámbar (Casi centrada)
        statusText = 'AJUSTANDO...';
      }

      // Actualizar textos del HUD
      scoreVal.textContent = `${result.score}%`;
      coreVal.textContent = result.coreHits;
      ringVal.textContent = result.ringHits;
      statusBadge.textContent = statusText;
      statusBadge.style.background = haloColor;

      // Dibujar el Halo del O-ring
      ctx.save();
      ctx.beginPath();
      ctx.arc(params.x, params.y, params.r, 0, Math.PI * 2);
      ctx.lineWidth = 6;
      ctx.strokeStyle = haloColor;
      ctx.shadowColor = haloColor;
      ctx.shadowBlur = 15;
      ctx.stroke();

      // Dibujar círculo guía interior (límite entre Núcleo y Corona de puntos blancos)
      ctx.beginPath();
      ctx.setLineDash([5, 5]);
      ctx.arc(params.x, params.y, params.r * 0.74, 0, Math.PI * 2);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.shadowBlur = 0;
      ctx.stroke();
      ctx.setLineDash([]);

      // Cruceta central sutil
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(params.x - 8, params.y);
      ctx.lineTo(params.x + 8, params.y);
      ctx.moveTo(params.x, params.y - 8);
      ctx.lineTo(params.x, params.y + 8);
      ctx.stroke();

      // Si el borde corta el interior, dibujar flecha indicando hacia dónde empujar la muestra
      if (result.score < params.greenScoreThreshold && result.intrudeVec) {
        const vx = result.intrudeVec.x;
        const vy = result.intrudeVec.y;
        const mag = Math.hypot(vx, vy) || 1;
        // Empujar en dirección hacia el borde intruso para sacar el escalón del centro
        const dirX = (vx / mag) * 35;
        const dirY = (vy / mag) * 35;

        ctx.strokeStyle = '#ef4444';
        ctx.fillStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(params.x, params.y);
        ctx.lineTo(params.x + dirX, params.y + dirY);
        ctx.stroke();

        // Punta de flecha
        ctx.beginPath();
        ctx.arc(params.x + dirX, params.y + dirY, 4, 0, Math.PI * 2);
        ctx.fill();

        guideText.textContent = '⚠️ Borde dentro del O-ring: desplaza la muestra siguiendo el vector';
      } else if (result.score >= params.greenScoreThreshold) {
        guideText.textContent = '✅ Superficie anodizada alineada al 100% con el O-ring';
      } else {
        guideText.textContent = 'Alinea el anillo de puntos blancos con la corona punteada';
      }

      ctx.restore();
      requestAnimationFrame(renderLoop);
    }

    // Iniciar bucle en tiempo real
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
